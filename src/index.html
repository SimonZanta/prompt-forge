<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt Forge</title>
<!-- Applies the saved theme, accent and rail width before the first paint to avoid a flash; kept inline on
     purpose because bundled scripts run after the stylesheet is applied. -->
<script>
  (function () {
    var savedTheme = null, ui = null, root = document.documentElement;
    try { savedTheme = localStorage.getItem('theme'); ui = JSON.parse(localStorage.getItem('ui')); } catch (e) {}
    root.dataset.theme = savedTheme === 'light' ? 'light' : 'dark';
    if (!ui) return;
    // only the raw colour is stored; theme.css derives the two tints from it
    if (/^#[0-9A-Fa-f]{6}$/.test(ui.accent || '')) root.style.setProperty('--accent', ui.accent);
    if (typeof ui.railWidth === 'number') root.style.setProperty('--rail', Math.max(150, Math.min(420, ui.railWidth)) + 'px');
  })();
</script>
<link rel="stylesheet" href="./shared/theme.css">
<link rel="stylesheet" href="./shared/base.css">
<link rel="stylesheet" href="./editor/editor.css">
</head>
<body>
<div class="app">
  <main class="main">
    <div class="topbar">
      <button id="back" class="iconbtn" type="button" hidden aria-label="Back to prompts" title="Back to prompts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      </button>
      <span class="mark" aria-hidden="true"></span>
      <input id="title" class="title" placeholder="untitled" spellcheck="false" aria-label="Prompt name">
      <span id="folder-chip" class="chip" hidden></span>
      <span id="settings-label" class="pagelabel" hidden>Settings <span id="settings-status" class="pagestatus"></span></span>
      <span id="status" aria-live="polite"></span>
      <div class="spacer"></div>
      <div id="view-seg" class="seg" role="group" aria-label="View">
        <button id="view-blocks" type="button" aria-pressed="true">Blocks</button>
        <button id="view-xml" type="button" aria-pressed="false">XML</button>
      </div>
      <span id="copied" class="copied" role="status" aria-live="polite" hidden>Copied!</span>
      <button id="copy" class="iconbtn" type="button" title="Copy whole XML to clipboard" aria-label="Copy XML">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>
        </svg>
      </button>
    </div>
    <div id="canvas" class="canvas"></div>
    <div id="settings" class="settings" hidden></div>
    <div id="xmlwrap" class="xmlwrap" hidden>
      <p id="xml-note" class="xml-note" hidden>This prompt is not well-formed XML, so it can only be edited here. Blocks become available once it parses.</p>
      <div class="editor-wrap">
        <pre id="highlight" class="code-layer" aria-hidden="true"><code id="hl"></code></pre>
        <textarea id="editor" class="code-layer" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Raw XML"></textarea>
        <div id="suggest" hidden></div>
      </div>
    </div>
  </main>

  <div id="rail-grip" class="railgrip" role="separator" aria-orientation="vertical" aria-label="Resize panel" tabindex="0"
       aria-valuemin="150" aria-valuemax="420" aria-valuenow="190"></div>

  <aside class="rail" id="rail" aria-label="Prompts">
    <div class="railtop">
      <svg class="railicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg>
      <input id="search" class="search" placeholder="Search prompts" aria-label="Search prompts" spellcheck="false" autocomplete="off">
      <button id="new-folder" class="iconbtn" type="button" aria-label="New folder" title="New folder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8a2 2 0 0 1 2-2h3l2 2h7a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M12 12v4M10 14h4"/></svg>
      </button>
    </div>
    <div id="tree" class="tree" role="tree" aria-label="Folders and prompts"></div>
    <div class="railstorage">
      <span id="storage-label" class="storage-label"></span>
      <button id="storage-open" hidden title="Read and save prompts as .xml files in a folder on this computer">Open folder…</button>
      <button id="storage-reconnect" hidden>Reconnect</button>
      <button id="storage-browser" hidden title="Keep the files on disk, but go back to prompts stored in this browser">Use browser storage</button>
      <div id="storage-note" class="storage-note" hidden>Folder sync needs Chrome or Edge on desktop; prompts are kept in this browser.</div>
    </div>
    <div class="railfoot">
      <button id="theme" class="iconbtn" type="button" title="Toggle dark / light mode" aria-label="Toggle theme">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      </button>
      <button id="settings-btn" class="iconbtn" type="button" title="Settings" aria-label="Settings" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 3.5 13 6l2.6-.6 1.4 2.4-1.8 2 1.8 2-1.4 2.4L13 18l-1 2.5h-2L9 18l-2.6.6L5 16.2l1.8-2-1.8-2 1.4-2.4L9 6l1-2.5z"/></svg>
      </button>
    </div>
  </aside>
</div>

<div id="tip" class="tip" hidden role="tooltip"></div>

<script type="module" src="./editor/main.ts"></script>
</body>
</html>
