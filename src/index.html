<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt Forge</title>
<!-- Applies the saved theme and accent before the first paint to avoid a flash; kept inline on purpose because
     bundled scripts run after the stylesheet is applied. -->
<script>
  (function () {
    var savedTheme = null, ui = null;
    try { savedTheme = localStorage.getItem('theme'); ui = JSON.parse(localStorage.getItem('ui')); } catch (e) {}
    document.documentElement.dataset.theme = savedTheme === 'light' ? 'light' : 'dark';
    // only the raw colour is stored; theme.css derives the two tints from it
    if (ui && /^#[0-9A-Fa-f]{6}$/.test(ui.accent || '')) document.documentElement.style.setProperty('--accent', ui.accent);
  })();
</script>
<link rel="stylesheet" href="./shared/theme.css">
<link rel="stylesheet" href="./shared/base.css">
<link rel="stylesheet" href="./editor/editor.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="slider">
      <div class="pane">
        <div class="sidebar-head">
          <span class="brand">folders</span>
          <button id="new-folder" title="New folder">+</button>
        </div>
        <ul id="folder-list" class="side-list"></ul>
      </div>
      <div class="pane">
        <div class="sidebar-head">
          <button id="back" title="Back to folders">‹</button>
          <span class="brand" id="folder-name"></span>
          <button id="new" title="New prompt">+</button>
        </div>
        <ul id="list" class="side-list"></ul>
      </div>
    </div>
    <div class="storage-bar">
      <span id="storage-label" class="storage-label"></span>
      <button id="storage-open" hidden title="Read and save prompts as .xml files in a folder on this computer">Open folder…</button>
      <button id="storage-reconnect" hidden>Reconnect</button>
      <button id="storage-browser" hidden title="Keep the files on disk, but go back to prompts stored in this browser">Use browser storage</button>
      <div id="storage-note" class="storage-note" hidden>Folder sync needs Chrome or Edge on desktop; prompts are kept in this browser.</div>
    </div>
    <div class="sidebar-foot">
      <button id="theme" title="Toggle dark / light mode">
        <svg class="sun" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
          <circle cx="8" cy="8" r="3"/>
          <path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1.06 1.06M11.54 11.54l1.06 1.06M3.4 12.6l1.06-1.06M11.54 4.46l1.06-1.06"/>
        </svg>
        <svg class="moon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13.5 9.8A6 6 0 0 1 6.2 2.5a6 6 0 1 0 7.3 7.3z"/>
        </svg>
      </button>
      <a id="settings-link" href="./settings.html" title="Settings">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="8" cy="8" r="2.2"/>
          <path d="M8 1.5v1.8M8 12.7v1.8M1.5 8h1.8M12.7 8h1.8M3.4 3.4l1.3 1.3M11.3 11.3l1.3 1.3M3.4 12.6l1.3-1.3M11.3 4.7l1.3-1.3"/>
          <circle cx="8" cy="8" r="4.6"/>
        </svg>
      </a>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <span class="mark" aria-hidden="true"></span>
      <input id="title" class="title" placeholder="untitled" spellcheck="false" aria-label="Prompt name">
      <span id="status" aria-live="polite"></span>
      <div class="spacer"></div>
      <div class="seg" role="group" aria-label="View">
        <button id="view-blocks" type="button" aria-pressed="true">Blocks</button>
        <button id="view-xml" type="button" aria-pressed="false">XML</button>
      </div>
      <button id="copy" class="iconbtn" type="button" title="Copy whole XML to clipboard" aria-label="Copy XML">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>
        </svg>
      </button>
    </div>
    <div id="canvas" class="canvas"></div>
    <div id="xmlwrap" class="xmlwrap" hidden>
      <p id="xml-note" class="xml-note" hidden>This prompt is not well-formed XML, so it can only be edited here. Blocks become available once it parses.</p>
      <div class="editor-wrap">
        <pre id="highlight" class="code-layer" aria-hidden="true"><code id="hl"></code></pre>
        <textarea id="editor" class="code-layer" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Raw XML"></textarea>
        <div id="suggest" hidden></div>
      </div>
    </div>
  </main>
</div>

<div id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h2 id="modal-title">New prompt</h2>
    <input id="modal-input" spellcheck="false" autocomplete="off">
    <div class="modal-actions">
      <button id="modal-cancel" type="button">Cancel</button>
      <button id="modal-ok" class="primary" type="button">Create</button>
    </div>
  </div>
</div>

<script type="module" src="./editor/main.ts"></script>
</body>
</html>
