<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt Forge</title>
<style>
:root{
  --accent:#4C8DF5;
  --accent-soft:rgba(76,141,245,.16);
  --accent-text:#8FB6F8;
  --radius:6px;
  --rail:190px;
  --font-sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace;
}
html[data-theme="dark"]{
  --bg:#17181a; --surface:#1b1d20; --raised:#212328;
  --border:#292c31; --border-strong:#3a3e45;
  --text:#dfe1e4; --text-2:#989ca3; --text-3:#6a6e75;
  --danger:#e0736b; --ok:#6bbf8a;
}
html[data-theme="light"]{
  --bg:#fbfbfa; --surface:#f2f2f0; --raised:#ffffff;
  --border:#e4e3df; --border-strong:#cbcac5;
  --text:#232427; --text-2:#6b6e73; --text-3:#93969b;
  --danger:#b8433a; --ok:#2f7d52;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--font-sans); font-size:13px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.app{height:100vh;display:flex;flex-direction:column}

.topbar{
  display:flex;align-items:center;gap:10px;
  padding:0 14px;height:44px;flex:none;
  border-bottom:1px solid var(--border);
}
.mark{width:13px;height:13px;border-radius:3px;background:var(--accent);flex:none}
.title{font-size:13.5px;font-weight:500;background:none;border:0;min-width:120px;flex:0 1 auto;padding:2px 4px;border-radius:var(--radius)}
.title:hover{background:var(--surface)}
.chip{
  font-size:11px;color:var(--text-2);background:var(--surface);
  border-radius:var(--radius);padding:2px 8px;white-space:nowrap;
}
.spacer{margin-left:auto}
.seg{display:flex;gap:2px;background:var(--surface);border-radius:var(--radius);padding:2px}
.seg button{font-size:11.5px;padding:3px 10px;border-radius:4px;color:var(--text-2)}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--text)}
.seg button:last-child{font-family:var(--font-mono)}
.iconbtn{
  width:26px;height:26px;display:grid;place-items:center;
  border-radius:var(--radius);color:var(--text-2);
}
.iconbtn:hover{background:var(--surface);color:var(--text)}
.iconbtn svg{width:15px;height:15px;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}

.body{flex:1;display:flex;min-height:0}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.canvas{flex:1;overflow:auto;padding:14px 16px 40px}

/* blocks */
.block{border:1px solid var(--border);border-radius:8px;padding:7px 9px;margin-bottom:7px;background:var(--raised)}
.block.nested{border:0;background:none;padding:0;margin-bottom:6px}
.bhead{display:flex;align-items:center;gap:7px;min-height:22px}
.twist{width:16px;height:16px;display:grid;place-items:center;color:var(--text-3);flex:none}
.twist svg{width:12px;height:12px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:transform .12s}
.twist[aria-expanded="false"] svg{transform:rotate(-90deg)}
.twist.leaf{visibility:hidden}
.tag{
  font-family:var(--font-mono);font-size:10.5px;border-radius:4px;padding:1px 6px;
  background:var(--surface);color:var(--text-2);white-space:nowrap;
}
.tag.root{background:var(--accent-soft);color:var(--accent-text)}
.meta{font-family:var(--font-mono);font-size:10.5px;color:var(--text-3);white-space:nowrap}
.peek{
  font-size:12px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;min-width:0;flex:1;
}
.tools{margin-left:auto;display:flex;gap:2px;opacity:0;flex:none}
.block:hover>.bhead>.tools,.bhead:focus-within .tools{opacity:1}
.tools .iconbtn{width:22px;height:22px}
.tools .iconbtn svg{width:13px;height:13px}
.grip{cursor:grab}
.text{
  font-size:12.5px;line-height:1.65;margin:4px 0 0 23px;padding:2px 4px;
  border-radius:var(--radius);white-space:pre-wrap;overflow-wrap:anywhere;outline:none;min-height:20px;
}
.text:hover{background:var(--surface)}
.text:focus{background:var(--surface);box-shadow:inset 0 0 0 1px var(--border-strong)}
.text:empty::before{content:attr(data-ph);color:var(--text-3)}
.kids{margin:6px 0 0 23px;padding-left:12px;border-left:1px solid var(--border)}
.dropping{box-shadow:0 -2px 0 var(--accent)}

.addrow{display:flex;align-items:center;gap:7px;padding:5px 4px;color:var(--text-3);font-size:11.5px}
.addrow:hover{color:var(--text-2)}
.key{
  font-family:var(--font-mono);font-size:10.5px;border:1px solid var(--border);
  border-radius:4px;padding:0 5px;
}

/* xml view */
.xmlwrap{flex:1;display:flex;flex-direction:column;padding:14px 16px}
.xmlwrap[hidden]{display:none}

/* settings */
.settings{flex:1;overflow:auto;padding:16px 18px 40px;max-width:640px}
.settings[hidden]{display:none}
.sect+.sect{margin-top:26px}
.sect h2{margin:0 0 3px;font-size:13px;font-weight:500}
.sect p.hint{margin:0 0 12px;font-size:11.5px;color:var(--text-3);line-height:1.6}
.sect p.hint code{font-family:var(--font-mono);font-size:11px;background:var(--surface);border-radius:3px;padding:1px 4px}
.secthead{display:flex;align-items:center;margin-bottom:3px}
#settingsLabel{font-size:13.5px;font-weight:500;padding:2px 4px}
.btn{
  font-size:11.5px;color:var(--text-2);border:1px solid var(--border-strong);
  border-radius:var(--radius);padding:3px 10px;margin-left:auto;
}
.btn:hover{color:var(--text);background:var(--surface)}
.cblock{border:1px solid var(--border);border-radius:8px;padding:9px;margin-bottom:9px;background:var(--raised)}
.cbtop{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.cbname{
  flex:1;min-width:0;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:4px 8px;font-family:var(--font-mono);font-size:11.5px;
}
.cbedit{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:7px 9px 3px;
}
.cbedit .block{background:none;border-color:var(--border-strong)}
.cbtop .seg{margin-left:auto;padding:1px}
.cbtop .seg button{font-size:10.5px;padding:2px 8px}
.cbtop .iconbtn{margin-left:0}
.cbxml{
  width:100%;min-height:86px;resize:vertical;background:var(--surface);color:var(--text);
  border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;
  font-family:var(--font-mono);font-size:11.5px;line-height:1.75;tab-size:2;
}
.cbxml:focus,.cbname:focus{outline:none;border-color:var(--border-strong)}
.cbfoot{display:flex;gap:12px;padding-top:6px;font-family:var(--font-mono);font-size:10.5px;color:var(--text-3)}
.cbfoot .bad{color:var(--danger)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tagchip{
  display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;
  color:var(--text-2);background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:2px 4px 2px 8px;
}
.tagchip button{width:15px;height:15px;display:grid;place-items:center;color:var(--text-3);border-radius:3px}
.tagchip button:hover{color:var(--danger)}
.newtag{
  width:106px;background:none;border:1px dashed var(--border-strong);border-radius:var(--radius);
  padding:2px 8px;font-family:var(--font-mono);font-size:11px;
}
.newtag:focus{outline:none;border-style:solid}
.newtag::placeholder{color:var(--text-3)}
.xml{
  flex:1;width:100%;resize:none;background:var(--raised);color:var(--text);
  border:1px solid var(--border);border-radius:8px;padding:12px 14px;
  font-family:var(--font-mono);font-size:11.5px;line-height:1.9;tab-size:2;
}
.xml:focus{outline:none;border-color:var(--border-strong)}


/* rail resize handle */
.railgrip{width:5px;flex:none;cursor:col-resize;position:relative;background:none}
.railgrip::after{content:"";position:absolute;inset:0 2px;background:var(--accent);opacity:0;transition:opacity .12s}
.railgrip:hover::after,.railgrip.on::after{opacity:.65}
.railgrip:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:0}
body.resizing{user-select:none;cursor:col-resize}

/* right rail */
.rail{
  width:var(--rail);min-width:var(--rail);max-width:var(--rail);flex:none;overflow:hidden;
  border-left:1px solid var(--border);
  background:var(--surface);display:flex;flex-direction:column;
}
.railtop{display:flex;align-items:center;gap:6px;padding:0 8px 0 11px;height:38px;border-bottom:1px solid var(--border);flex:none}
.search{background:none;border:0;width:100%;min-width:0;font-size:11.5px;padding:2px 0}
.search::placeholder{color:var(--text-3)}
.tree{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 6px}
.row{
  display:flex;align-items:center;gap:5px;padding:4px 6px;min-width:0;
  border-radius:var(--radius);font-size:11.5px;color:var(--text-2);cursor:pointer;
}
.row:hover{background:var(--raised);color:var(--text)}
.row.on{background:var(--accent-soft);color:var(--accent-text)}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .ct{flex:none;font-family:var(--font-mono);font-size:10.5px;color:var(--text-3)}
.row.on .ct{color:var(--accent-text)}
.row svg{width:13px;height:13px;flex:none;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.row .cv{transition:transform .12s}
.row.shut .cv{transform:rotate(-90deg)}
.sub{margin-left:9px;padding-left:4px;border-left:1px solid var(--border);min-width:0}
.sub.tight{margin-left:3px;padding-left:3px}
.ftools{margin-left:auto;display:none;gap:1px;flex:none}
.row:hover .ftools,.row:focus-within .ftools{display:flex}
.row:hover .ct,.row:focus-within .ct{display:none}
.ftools button{width:18px;height:18px;display:grid;place-items:center;border-radius:3px;color:var(--text-3)}
.ftools button:hover{color:var(--text);background:var(--bg)}
.ftools svg{width:12px;height:12px}
.renamer{
  flex:1;min-width:0;background:var(--bg);border:1px solid var(--border-strong);
  border-radius:3px;padding:0 4px;font-size:11.5px;
}
.renamer:focus{outline:none}
.empty{padding:4px 6px 4px 20px;font-size:11px;color:var(--text-3)}
.railfoot{
  flex:none;display:flex;align-items:center;gap:8px;
  padding:0 10px;height:36px;border-top:1px solid var(--border);
}

/* accent picker */
.presets{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:10px;max-width:300px}
.preset{height:26px;border-radius:4px;border:1px solid var(--border);position:relative}
.preset[aria-pressed="true"]{box-shadow:0 0 0 1.5px var(--text-2)}
.customrow{display:flex;align-items:center;gap:6px;max-width:300px}
.customrow input[type=color]{width:26px;height:26px;padding:0;border:1px solid var(--border);border-radius:4px;background:none;cursor:pointer}
.hex{
  flex:1;min-width:0;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:4px 7px;font-family:var(--font-mono);font-size:11.5px;
}
.palerr{margin:7px 0 0;font-size:11px;color:var(--danger);min-height:15px}
.reset{font-size:11px;color:var(--text-3)}
.reset:hover{color:var(--text-2)}

/* hover tooltip */
.tip{
  position:fixed;z-index:60;max-width:260px;pointer-events:none;
  background:var(--raised);border:1px solid var(--border-strong);border-radius:var(--radius);
  padding:4px 9px;box-shadow:0 4px 14px rgba(0,0,0,.18);
}
.tipname{display:block;font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tippath{display:block;font-family:var(--font-mono);font-size:10.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* insert menu */
.menu{
  position:absolute;z-index:30;width:250px;
  background:var(--raised);border:1px solid var(--border-strong);border-radius:8px;
  overflow:hidden;
}
.menu[hidden]{display:none}
.menu input{
  width:100%;background:none;border:0;border-bottom:1px solid var(--border);
  padding:8px 11px;font-family:var(--font-mono);font-size:11.5px;
}
.menu input:focus{outline:none}
.mlist{max-height:220px;overflow:auto;padding:4px 0}
.mgroup{padding:5px 11px 3px;font-size:10.5px;color:var(--text-3)}
.mitem{display:flex;align-items:center;gap:8px;padding:6px 11px;width:100%;text-align:left}
.mitem .mt{font-family:var(--font-mono);font-size:11.5px}
.mitem .md{font-size:11px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mitem.sel{background:var(--accent-soft)}
.mitem.sel .mt{color:var(--accent-text)}
.mnone{padding:8px 11px;font-size:11.5px;color:var(--text-3)}
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <button class="iconbtn" id="back" hidden aria-label="Back to prompts" title="Back to prompts">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
    </button>
    <span class="mark" aria-hidden="true"></span>
    <input class="title" id="title" aria-label="Prompt name">
    <span class="chip" id="folderchip"></span>
    <span id="settingsLabel" hidden>Settings</span>
    <div class="spacer"></div>
    <div class="seg" id="seg" role="group" aria-label="View">
      <button id="tabBlocks" aria-pressed="true">Blocks</button>
      <button id="tabXml" aria-pressed="false">XML</button>
    </div>
    <button class="iconbtn" id="copy" aria-label="Copy XML" title="Copy XML">
      <svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
    </button>
  </div>

  <div class="body">
    <div class="main">
      <div class="canvas" id="canvas" data-editor="main"></div>
      <div class="xmlwrap" id="xmlwrap" hidden>
        <textarea class="xml" id="xml" spellcheck="false" aria-label="Raw XML"></textarea>
      </div>
      <div class="settings" id="settings" hidden></div>
    </div>

    <div class="railgrip" id="railGrip" role="separator" aria-orientation="vertical"
         aria-label="Resize panel" tabindex="0" aria-valuemin="150" aria-valuemax="420" aria-valuenow="190"></div>
    <div class="rail">
      <div class="railtop">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="color:var(--text-3);flex:none"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg>
        <input class="search" id="search" placeholder="Search prompts" aria-label="Search prompts">
        <button class="iconbtn" id="newFolder" aria-label="New folder" title="New folder">
          <svg viewBox="0 0 24 24"><path d="M4 8a2 2 0 0 1 2-2h3l2 2h7a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M12 12v4M10 14h4"/></svg>
        </button>
      </div>
      <div class="tree" id="tree"></div>
      <div class="railfoot">
        <button class="iconbtn" id="theme" aria-label="Toggle theme" title="Toggle theme">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></svg>
        </button>
        <button class="iconbtn" id="settingsBtn" aria-label="Settings" title="Settings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3.5 13 6l2.6-.6 1.4 2.4-1.8 2 1.8 2-1.4 2.4L13 18l-1 2.5h-2L9 18l-2.6.6L5 16.2l1.8-2-1.8-2 1.4-2.4L9 6l1-2.5z"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<div class="tip" id="tip" hidden role="tooltip"></div>

<div class="menu" id="menu" hidden role="dialog" aria-label="Insert block">
  <input id="menuq" placeholder="tag or block name" spellcheck="false" aria-label="Filter blocks">
  <div class="mlist" id="mlist"></div>
</div>

<script>
const uid = (p) => p + Math.random().toString(36).slice(2, 8);
const n = (tag, text, children) => ({ id: uid('n'), tag, text: text || '', children: children || [], open: true });

const PRESETS = [
  ['Cobalt', '#4C8DF5'], ['Teal', '#28A48A'], ['Moss', '#6C9A3F'],
  ['Amber', '#C98A26'], ['Violet', '#8C7BF0'], ['Clay', '#CC6A4E']
];

let TAGS = ['context', 'tasks', 'task', 'task_description', 'rules', 'rule', 'examples',
  'example', 'role', 'constraints', 'output_format', 'thinking', 'data', 'question'];

let BLOCKS = [
  { name: 'task-block', mode: 'blocks',
    nodes: [n('task', '', [n('task_description'), n('example')])] },
  { name: 'rules-block', mode: 'blocks',
    nodes: [n('rules', '', [n('rule'), n('rule'), n('rule')])] },
  { name: 'context-block', mode: 'xml',
    nodes: [n('context', '', [n('constraints')])] }
];

const folders = [
  { id: 'f1', name: 'bug fix', parent: null, open: false },
  { id: 'f2', name: 'default', parent: null, open: true },
  { id: 'f4', name: 'archive', parent: 'f2', open: false },
  { id: 'f3', name: 'vývoj aplikace', parent: null, open: true }
];

const prompts = [
  { id: 'p1', folder: 'f2', name: 'schema audit', root: 'prompt', nodes: [
    n('context', 'Postgres schema for the payment gateway. Column names are Czech.'),
    n('tasks', '', [n('task', '', [n('task_description', 'List every table that stores a card token.')])])
  ]},
  { id: 'p2', folder: 'f2', name: 'tls handshake', root: 'prompt', nodes: [
    n('context', 'cURL against the acquirer endpoint fails during the TLS handshake.'),
    n('task', '', [n('task_description', 'Read the trace and tell me which cipher list to pin.')])
  ]},
  { id: 'p3', folder: 'f4', name: 'old migration notes', root: 'prompt', nodes: [
    n('context', 'Kept for reference. Superseded by schema audit.')
  ]},
  { id: 'p4', folder: 'f4', name: 'legacy gateway prompt', root: 'prompt', nodes: [
    n('context', 'Old wording, do not reuse.')
  ]},
  { id: 'p5', folder: 'f3', name: 'availability', root: 'prompt', nodes: [
    n('context', "I want to host this app fully online — clientside only, so I don't need any storage. Analyze how files are stored today."),
    n('tasks', '', [
      n('task', '', [n('task_description', 'Explore how we currently handle saving of files.')]),
      n('task', 'Find the optimal way to implement my request — libs or inhouse.', [
        n('rules', '', [
          n('rule', "Only find the way — don't implement"),
          n('rule', 'Ask me if this is the way I want it'),
          n('rule', 'Keep the result simple to read')
        ])
      ])
    ])
  ]}
];

let current = 'p5';
let view = 'blocks';
let accent = '#4C8DF5';
let menuTarget = null;
let menuEditor = null;
let renaming = null;
let menuSel = 0;
let menuItems = [];

const $ = (id) => document.getElementById(id);
const cur = () => prompts.find(p => p.id === current);

/* ---------- accent theming ---------- */
function hexToHsl(hex) {
  const v = hex.replace('#', '');
  const r = parseInt(v.slice(0, 2), 16) / 255, g = parseInt(v.slice(2, 4), 16) / 255, b = parseInt(v.slice(4, 6), 16) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
  let h = 0, s = 0;
  if (mx !== mn) {
    const d = mx - mn;
    s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
    if (mx === r) h = ((g - b) / d + (g < b ? 6 : 0));
    else if (mx === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60;
  }
  return [Math.round(h), Math.round(s * 100), Math.round(l * 100)];
}
function rgbOf(hex) {
  const v = hex.replace('#', '');
  return [0, 2, 4].map(i => parseInt(v.slice(i, i + 2), 16)).join(',');
}
function applyAccent(hex) {
  accent = hex.toUpperCase();
  const dark = document.documentElement.dataset.theme === 'dark';
  const [h, s] = hexToHsl(accent);
  const r = document.documentElement.style;
  r.setProperty('--accent', accent);
  r.setProperty('--accent-soft', `rgba(${rgbOf(accent)},${dark ? 0.18 : 0.13})`);
  r.setProperty('--accent-text', `hsl(${h} ${Math.max(s, 35)}% ${dark ? 72 : 38}%)`);
  if ($('picker')) $('picker').value = accent;
  if ($('hex')) $('hex').value = accent;
  document.querySelectorAll('.preset').forEach(b =>

/* ---------- tree ---------- */

function renderTree() {
  const q = $('search').value.trim().toLowerCase();

      const inner = walk(f.id, depth + 1);
      const kids = prompts.filter(p => p.folder === f.id && p.name.toLowerCase().includes(q));
      if (q && !inner && !kids.length) return;

        ? `<input class="renamer" data-renamer value="${esc(f.name)}" aria-label="Folder name">`
        : `<span class="nm">${esc(f.name)}</span>`;

/* ---------- blocks ---------- */
const words = (s) => s.trim() ? s.trim().split(/\s+/).length : 0;

  <button class="iconbtn" data-del aria-label="Delete block" title="Delete"><svg viewBox="0 0 24 24"><path d="M5 7h14M9 7V5h6v2M7 7l1 13h8l1-13"/></svg></button>

function nodeHtml(node, depth) {

    ? `<span class="peek">${esc(node.text || (kids ? kids + ' nested' : 'empty'))}</span>`
    : (kids ? `<span class="meta">${kids}</span>` : (node.text ? `<span class="meta">${words(node.text)} w</span>` : ''));
  const twist = `<button class="twist ${kids || node.text ? '' : 'leaf'}" data-twist aria-expanded="${node.open}" aria-label="Collapse block"><span>${TW}</span></button>`;
  let inner = '';

    if (!kids || node.text) {

/* ---------- editors ---------- */

function renderEditor(id) {

    `<button class="addrow" data-addroot><span class="key">/</span> type to insert a block</button>`;

/* ---------- model helpers ---------- */
function findNode(id, list, parent) {
  for (let i = 0; i < list.length; i++) {
    if (list[i].id === id) return { node: list[i], list, i, parent: parent || null };
    const hit = findNode(id, list[i].children, list[i]);
    if (hit) return hit;
  }

}

  return list.map(x => n(x.tag, x.text, cloneNodes(x.children)));
}

/* ---------- xml ---------- */
function serialize(list, d) {

  return list.map(x => {
    const t = esc(x.text).trim();
    if (!x.children.length) return `${pad(d)}<${x.tag}>${t}</${x.tag}>`;
    return `${pad(d)}<${x.tag}>${t ? '\n' + pad(d + 1) + t : ''}\n${serialize(x.children, d + 1)}\n${pad(d)}</${x.tag}>`;
  }).join('\n');

/* ---------- insert menu ---------- */

/* ---------- events: any editor ---------- */
/* Delegated on the document so editors mounted later (block definitions in
   settings) need no extra wiring. */
const ownerOf = (el) => {

document.addEventListener('click', (e) => {
  const own = ownerOf(e.target);
  if (!own || !own.reg) return;
  const add = e.target.closest('[data-addroot]');
  if (add) return openMenu(add, own.id, null);
  const blk = e.target.closest('[data-node]');
  if (!blk) return;
  const hit = findNode(blk.dataset.node, own.reg.getNodes());
  if (!hit) return;
  if (e.target.closest('[data-twist]')) { hit.node.open = !hit.node.open; renderEditor(own.id); }
  else if (e.target.closest('[data-add]')) openMenu(e.target.closest('[data-add]'), own.id, hit.node.id);
  else if (e.target.closest('[data-del]')) { hit.list.splice(hit.i, 1); renderEditor(own.id); }

  const box = e.target.closest('[data-text]');

let dragId = null;

  document.querySelectorAll('.dropping').forEach(el => el.classList.remove('dropping'));
  blk.classList.add('dropping');

  const blk = e.target.closest('[data-node]');

  if (!blk || !dragId) return;

  dragId = null;

function newFolder(parent) {
  const f = { id: uid('f'), name: 'New folder', parent, open: true };
  folders.push(f);

  const sub = e.target.closest('[data-addsub]');
  if (sub) { commitRename(); return newFolder(sub.dataset.addsub); }
  const ren = e.target.closest('[data-rename]');

  const dfl = e.target.closest('[data-delfolder]');
  if (dfl) {
    const id = dfl.dataset.delfolder;

    return renderTree();
  }

    f.open = !f.open;
    renderTree();
  } else if (row.dataset.prompt) {
    current = row.dataset.prompt;
    if (view === 'settings') view = 'blocks';
    renderAll();
  } else if (row.dataset.new) {
    const p = { id: uid('p'), folder: row.dataset.new, name: 'Untitled prompt', root: 'prompt', nodes: [n('context')] };
    prompts.push(p);

$('settings').addEventListener('change', (e) => {
  if (e.target.id !== 'hex') return;
  const v = e.target.value.trim().replace(/^#?/, '#');
  if (!/^#[0-9a-f]{6}$/i.test(v)) { $('palErr').textContent = 'Use a six-digit hex, like #4C8DF5'; return; }
  $('palErr').textContent = '';
  applyAccent(v);
});
$('settings').addEventListener('keydown', (e) => {
  if (e.target.id === 'newTag' && e.key === 'Enter') {
    const v = e.target.value.trim().replace(/[^\w.-]/g, '');
    if (v && !TAGS.includes(v)) { TAGS.push(v); renderSettings(); $('newTag').focus(); }
    else e.target.value = '';
  }
});
$('settingsBtn').addEventListener('click', () => { view = 'settings'; setView(); });
$('back').addEventListener('click', () => { view = 'blocks'; setView(); });

/* ---------- events: view + theme + palette ---------- */
function setView() {
  const set = view === 'settings';
  $('canvas').hidden = view !== 'blocks';
  $('xmlwrap').hidden = view !== 'xml';
  $('settings').hidden = !set;
  $('back').hidden = !set;
  $('settingsLabel').hidden = !set;
  $('title').hidden = set;
  $('folderchip').hidden = set;
  $('seg').hidden = set;
  $('copy').hidden = set;
  $('tabBlocks').setAttribute('aria-pressed', String(view === 'blocks'));
  $('tabXml').setAttribute('aria-pressed', String(view === 'xml'));
  if (view === 'blocks') renderEditor('main');
  else if (view === 'xml') $('xml').value = xmlOf(cur());
  else renderSettings();
}
$('tabBlocks').addEventListener('click', () => { view = 'blocks'; setView(); });
$('tabXml').addEventListener('click', () => { view = 'xml'; setView(); });
$('xml').addEventListener('input', () => {
  const parsed = parseXml($('xml').value);
  if (!parsed) return;
  const p = cur();
  p.root = parsed.root;
  p.nodes = parsed.nodes;
});
$('theme').addEventListener('click', () => {
  const el = document.documentElement;
  el.dataset.theme = el.dataset.theme === 'dark' ? 'light' : 'dark';
  applyAccent(accent);
});
$('copy').addEventListener('click', async (e) => {
  const btn = e.currentTarget;
  try {
    await navigator.clipboard.writeText(xmlOf(cur()));
    btn.title = 'Copied';
  } catch (err) {
    btn.title = 'Copy blocked by the browser';
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && !e.target.closest('input,textarea,[contenteditable]')) {
    e.preventDefault();
    const a = editorEl('main') && editorEl('main').querySelector('[data-addroot]');
    if (a && view === 'blocks') openMenu(a, 'main', null);
  }
});

/* ---------- hover tooltip ---------- */
/* Rail names are ellipsised at 190px, so hovering a row shows the full name
   plus where it sits — useful now that folders can nest arbitrarily deep. */
let tipTimer = null;

function pathOf(folderId) {
  const parts = [];
  let f = folders.find(x => x.id === folderId);
  while (f) { parts.unshift(f.name); f = folders.find(x => x.id === f.parent); }
  return parts;
}
function hideTip() {
  clearTimeout(tipTimer);
  $('tip').hidden = true;
}
function showTip(row) {
  const tip = $('tip');
  let name, path;
  if (row.dataset.folder) {
    const parts = pathOf(row.dataset.folder);
    name = parts.pop();
    path = parts;
  } else {
    const p = prompts.find(x => x.id === row.dataset.prompt);
    if (!p) return;
    name = p.name;
    path = pathOf(p.folder);
  }
  tip.innerHTML = `<span class="tipname">${esc(name)}</span>` +
    (path.length ? `<span class="tippath">${esc(path.join(' / '))}</span>` : '');

  tip.hidden = false;
  tip.style.left = '0px';
  tip.style.top = '0px';
  const r = row.getBoundingClientRect(), t = tip.getBoundingClientRect();
  let left = r.left - t.width - 8;
  if (left < 8) left = Math.min(r.right + 8, window.innerWidth - t.width - 8);
  let top = r.top + r.height / 2 - t.height / 2;
  top = Math.max(8, Math.min(top, window.innerHeight - t.height - 8));
  tip.style.left = left + 'px';
  tip.style.top = top + 'px';
}
$('tree').addEventListener('pointerover', (e) => {
  const row = e.target.closest('.row');
  if (!row || (!row.dataset.folder && !row.dataset.prompt)) return hideTip();
  if (row.querySelector('[data-renamer]')) return hideTip();
  clearTimeout(tipTimer);
  tipTimer = setTimeout(() => showTip(row), 180);
});
$('tree').addEventListener('pointerout', (e) => {
  if (!e.relatedTarget || !e.relatedTarget.closest || !e.relatedTarget.closest('.row')) hideTip();
});
$('tree').addEventListener('scroll', hideTip);
$('tree').addEventListener('pointerdown', hideTip);
$('tree').addEventListener('focusin', (e) => {
  const row = e.target.closest('.row');
  if (!row || row.querySelector('[data-renamer]')) return hideTip();
  if (row.dataset.folder || row.dataset.prompt) showTip(row);
});
$('tree').addEventListener('focusout', hideTip);
window.addEventListener('blur', hideTip);

/* ---------- rail resize ---------- */
const RAIL_MIN = 150, RAIL_MAX = 420, RAIL_DEFAULT = 190;
let railW = RAIL_DEFAULT;

function setRail(px) {
  railW = Math.max(RAIL_MIN, Math.min(RAIL_MAX, Math.round(px)));
  document.documentElement.style.setProperty('--rail', railW + 'px');
  $('railGrip').setAttribute('aria-valuenow', String(railW));
}
$('railGrip').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  hideTip();
  const startX = e.clientX, startW = railW;
  $('railGrip').classList.add('on');
  document.body.classList.add('resizing');
  /* rail sits on the right, so dragging left widens it */
  const move = (ev) => setRail(startW - (ev.clientX - startX));
  const up = () => {
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', up);
    $('railGrip').classList.remove('on');
    document.body.classList.remove('resizing');
  };
  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', up);
});
$('railGrip').addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') { e.preventDefault(); setRail(railW + 16); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); setRail(railW - 16); }
  else if (e.key === 'Home') { e.preventDefault(); setRail(RAIL_DEFAULT); }
});
$('railGrip').addEventListener('dblclick', () => setRail(RAIL_DEFAULT));

mountEditor('main', () => cur().nodes);
applyAccent(accent);
renderAll();
</script>
