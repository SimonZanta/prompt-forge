<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Prompt Forge</title>
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('theme'); } catch (e) {}
    document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
  })();
</script>
<style>
  :root {
    --bg: #1a1a1a;
    --bg-sidebar: #101010;
    --bg-elevated: #262626;
    --bg-hover: #2c2c2c;
    --bg-hover-soft: rgba(255,255,255,.06);
    --fg: #c6c6c6;
    --fg-strong: #e0e0e0;
    --fg-muted: #7a7a7a;
    --fg-dim: #5c5c5c;
    --fg-title: #9a9a9a;
    --fg-list-hover: #c9c9c9;
    --fg-list-active: #ececec;
    --fg-menu: #b5b5b5;
    --fg-menu-hover: #eeeeee;
    --border: #333333;
    --shadow: rgba(0,0,0,.45);
    --accent: #85a3c4;
    --danger: #dd9999;
    --ok: #8fc98f;
    --caret: #e8e8e8;
    --selection: rgba(104,140,176,.35);
    --tag-0: #c88484;
    --tag-1: #91c884;
    --tag-2: #849fc8;
    --tag-3: #84c89f;
    --tag-4: #bac884;
    --tag-5: #84c8c8;
    --tag-6: #ba84c8;
    --tag-7: #c8ad84;
    --tag-8: #c884ad;
    --tag-9: #9184c8;
    --punct: #555555;
    --attr: #c4b385;
    --md-b: #dcc389;
    --md-i: #b79cc9;
    --md-c: #c9a189;
    --md-c-bg: rgba(255,255,255,.05);
    --md-h: #8fc4b0;
    --md-cb: #b5bda9;
    --md-cb-bg: rgba(255,255,255,.04);
    --md-f: #5d6a75;
    --placeholder: #494949;
    --suggest-bg: #232323;
    --suggest-fg: #a8a8a8;
    --suggest-sel-bg: #333333;
    --suggest-sel-fg: #ffffff;
    --scrollbar: #2e2e2e;
    --scrollbar-hover: #3d3d3d;
  }
  html[data-theme="light"] {
    --bg: #f3f3f1;
    --bg-sidebar: #e6e6e2;
    --bg-elevated: #ffffff;

    --fg: #2b2b2b;

    --fg-muted: #7d7d7a;
    --fg-dim: #9a9a96;
    --fg-title: #555555;
    --fg-list-hover: #333333;
    --fg-list-active: #111111;
    --fg-menu: #444444;
    --fg-menu-hover: #111111;

    --shadow: rgba(0,0,0,.14);
    --accent: #3d6a99;
    --danger: #c04a4a;
    --ok: #3c8c3c;
    --caret: #111111;
    --selection: rgba(61,106,153,.25);
    --tag-0: #b03a3a;
    --tag-1: #3f8a2f;
    --tag-2: #3a5fb0;
    --tag-3: #2f8a5a;
    --tag-4: #857f1f;
    --tag-5: #1f8585;
    --tag-6: #8a3fb0;
    --tag-7: #9a6a1f;
    --tag-8: #b03a7a;
    --tag-9: #5a3fb0;
    --punct: #a0a09c;
    --attr: #8a6d1f;
    --md-b: #8a6a10;
    --md-i: #6f4a8f;
    --md-c: #9a4f2a;
    --md-c-bg: rgba(0,0,0,.06);
    --md-h: #2a7a5f;
    --md-cb: #4a5a3f;
    --md-cb-bg: rgba(0,0,0,.045);
    --md-f: #8c99a3;

    --suggest-bg: #ffffff;
    --suggest-fg: #444444;

    --suggest-sel-fg: #111111;
    --scrollbar: #cfcfcb;
    --scrollbar-hover: #b8b8b4;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  button { font-family: inherit; }
  .app { display: flex; height: 100vh; }

  /* ---------- sidebar ---------- */
  .sidebar {
    width: 220px;
    min-width: 180px;
    padding: 20px 0 12px;
    display: flex;
    flex-direction: column;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border);
    overflow: hidden;
  }
  .slider {
    flex: 1;
    min-height: 0;
    display: flex;
    width: 200%;
    transform: translateX(0);
    transition: transform .28s ease;
  }
  .sidebar.in-folder .slider { transform: translateX(-50%); }
  .pane {
    width: 50%;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }
  .sidebar-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px 12px;
    position: relative;
  }
  .brand { font-size: 11px; letter-spacing: .16em; color: var(--fg-dim); }
  #folder-name {
    flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    text-align: left;
  }
  #new, #new-folder, #back {
    background: none; border: none;
    color: var(--fg-muted);
    font-size: 19px; line-height: 1;
    cursor: pointer;
    padding: 0 4px;
  }
  #new:hover, #new-folder:hover, #back:hover { color: var(--fg-strong); }
  #back { font-size: 17px; margin-left: -6px; }
  #tmenu {
    position: absolute;
    right: 12px; top: 26px;
    z-index: 20;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 0;
    min-width: 180px;
    box-shadow: 0 8px 22px var(--shadow);
  }
  #tmenu .tmenu-label { padding: 5px 14px 3px; font-size: 10.5px; letter-spacing: .1em; color: var(--fg-dim); }
  #tmenu div.item { padding: 6px 14px; font-size: 12.5px; color: var(--fg-menu); cursor: pointer; }
  #tmenu div.item:hover { background: var(--bg-hover); color: var(--fg-menu-hover); }
  .side-list { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
  .side-list li {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 20px;
    font-size: 13px;
    color: var(--fg-muted);
    cursor: pointer;
  }
  .side-list li:hover { color: var(--fg-list-hover); }
  .side-list li.active { color: var(--fg-list-active); }
  .side-list li .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side-list li .count { font-size: 10.5px; color: var(--fg-dim); }
  .side-list li .del {
    visibility: hidden;
    background: none; border: none;
    color: var(--fg-dim);
    cursor: pointer;
    font-size: 15px; line-height: 1;
    padding: 0 2px;
  }
  .side-list li:hover .del { visibility: visible; }
  .side-list li .del:hover { color: var(--danger); }
  .sidebar-foot {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 20px 0;
  }
  .sidebar-foot button {
    background: none; border: none;
    color: var(--fg-muted);
    cursor: pointer;
    padding: 4px;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .sidebar-foot button:hover { color: var(--fg-strong); background: var(--bg-hover-soft); }
  .sidebar-foot button svg { width: 15px; height: 15px; }
  .sidebar-foot a {
    color: var(--fg-muted);
    padding: 4px;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .sidebar-foot a:hover { color: var(--fg-strong); background: var(--bg-hover-soft); }
  .sidebar-foot a svg { width: 15px; height: 15px; }
  #settings-link { margin-left: auto; }
  #theme .moon { display: none; }
  html[data-theme="light"] #theme .sun { display: none; }
  html[data-theme="light"] #theme .moon { display: block; }

  /* ---------- main column ---------- */
  .main { flex: 1; min-width: 0; display: flex; }
  .column {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    padding: 0 40px;
    display: flex;
    flex-direction: column;
  }
  .topbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 22px 6px 8px;
  }
  #title {
    flex: 1; min-width: 0;
    background: none; border: none; outline: none;
    color: var(--fg-title);
    font-size: 14px;
    font-family: inherit;
  }
  #title:focus { color: var(--fg-strong); }
  #status { font-size: 10px; color: var(--fg-dim); width: 10px; text-align: center; }
  #copy {
    background: none; border: none;
    color: var(--fg-muted);
    cursor: pointer;
    padding: 6px;
    border-radius: 5px;
    display: flex;
  }
  #copy:hover { color: var(--fg-strong); background: var(--bg-hover-soft); }
  #copy.ok { color: var(--ok); }
  #copy svg { width: 16px; height: 16px; }

  /* ---------- editor ---------- */
  .editor-wrap { position: relative; flex: 1; }
  .code-layer {
    position: absolute; inset: 0;
    margin: 0;
    padding: 14px 6px 35vh;
    font-family: ui-monospace, "Cascadia Code", "Fira Code", "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 14px;
    line-height: 1.7;
    tab-size: 2;
    white-space: pre-wrap;
    word-wrap: break-word;
    overflow: auto;
    scrollbar-gutter: stable;
  }
  #highlight { color: var(--fg); pointer-events: none; overflow: hidden; }
  #editor {
    background: transparent;
    color: transparent;
    caret-color: var(--caret);
    border: none; outline: none;
    resize: none;
  }
  #editor::selection { background: var(--selection); color: transparent; }

  .tg { color: var(--accent); }
  .tg-0 { color: var(--tag-0); }
  .tg-1 { color: var(--tag-1); }
  .tg-2 { color: var(--tag-2); }
  .tg-3 { color: var(--tag-3); }
  .tg-4 { color: var(--tag-4); }
  .tg-5 { color: var(--tag-5); }
  .tg-6 { color: var(--tag-6); }
  .tg-7 { color: var(--tag-7); }
  .tg-8 { color: var(--tag-8); }
  .tg-9 { color: var(--tag-9); }
  .pu { color: var(--punct); }
  .at { color: var(--attr); }
  .md-b { color: var(--md-b); font-weight: 700; }
  .md-i { color: var(--md-i); font-style: italic; }
  .md-c { color: var(--md-c); background: var(--md-c-bg); border-radius: 3px; }
  .md-h { color: var(--md-h); font-weight: 700; }
  .md-cb { color: var(--md-cb); background: var(--md-cb-bg); border-radius: 4px; }
  .md-f { color: var(--md-f); }
  .ph { color: var(--placeholder); }

  /* ---------- suggestions ---------- */
  #suggest {
    position: absolute; z-index: 10;
    background: var(--suggest-bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    min-width: 190px; max-height: 220px;
    overflow-y: auto;
    box-shadow: 0 6px 18px var(--shadow);
    font-family: ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
    font-size: 13px;
  }
  #suggest div { padding: 4px 12px; cursor: pointer; color: var(--suggest-fg); }
  #suggest div.sel { background: var(--suggest-sel-bg); color: var(--suggest-sel-fg); }
  #suggest b { color: inherit; font-weight: 700; }
  #suggest div.block { color: var(--attr); }
  #suggest .badge {
    float: right;
    margin-left: 12px;
    font-size: 9.5px; letter-spacing: .08em;
    color: var(--attr); opacity: .8;
    line-height: 20px;
  }

  /* ---------- modal ---------- */
  #modal {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    background: var(--shadow);
  }
  #modal[hidden] { display: none; }
  .modal-card {
    width: 340px; max-width: calc(100vw - 40px);
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 18px 18px 14px;
    box-shadow: 0 12px 32px var(--shadow);
  }
  .modal-card h2 {
    margin: 0 0 12px;
    font-size: 11px; font-weight: 500; letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--fg-dim);
  }
  #modal-input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 7px 10px;
    font: inherit; font-size: 13.5px;
    color: var(--fg-strong);

  #modal-input:focus { border-color: var(--accent); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 6px; margin-top: 14px; }
  .modal-actions button {
    background: none; border: 1px solid transparent;
    border-radius: 5px;
    padding: 5px 12px;
    font-size: 12.5px;
    color: var(--fg-muted);
    cursor: pointer;
  }
  .modal-actions button:hover { color: var(--fg-strong); background: var(--bg-hover-soft); }
  .modal-actions button.primary { color: var(--accent); border-color: var(--border); }
  .modal-actions button.primary:hover { background: var(--bg-hover); }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-hover); }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div class="app">

          <path d="M8 1.5v1.8M8 12.7v1.8M1.5 8h1.8M12.7 8h1.8M3.4 3.4l1.3 1.3M11.3 11.3l1.3 1.3M3.4 12.6l1.3-1.3M11.3 4.7l1.3-1.3"/>

<div id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h2 id="modal-title">New prompt</h2>
    <input id="modal-input" spellcheck="false" autocomplete="off">
    <div class="modal-actions">
      <button id="modal-cancel" type="button">Cancel</button>
      <button id="modal-ok" class="primary" type="button">Create</button>

<script>
const $ = s => document.querySelector(s);
const ta = $('#editor'), hl = $('#hl'), hlPre = $('#highlight');
const sug = $('#suggest'), titleInput = $('#title'), statusEl = $('#status');
const wrapEl = document.querySelector('.editor-wrap');
const tmenu = $('#tmenu');

const TEMPLATES = [
  { name: 'Blank', content: '' },
  { name: 'Tasks', content:
`<prompt>
  <context>context ...</context>
  <additional_context>additional context ...</additional_context>
  <tasks>
    <task>
      <task_description></task_description>
      <example></example>
    </task>
    <task>
      <task_description></task_description>
      <example></example>
    </task>
  </tasks>
</prompt>
` },
  { name: 'Summarization', content:
`<prompt_summary>
  <instruction>
    Summarize the text provided in the \`<text_to_summarize>\` tag in a single concise paragraph.
    The answer should be placed within the \`<generated_summary>\` tag.
  </instruction>
  <text_to_summarize>

  </text_to_summarize>
  <expected_output_format>
    <generated_summary>[A concise paragraph here]</generated_summary>
  </expected_output_format>
</prompt_summary>
` },
  { name: 'General', content:
`<prompt>
  <role>

  </role>
  <instruction>

  </instruction>
  <context>

  </context>
  <output_format>

  </output_format>
</prompt>
` }
];

const WRAP_PAIRS = { '"': '"', "'": "'", '(': ')', '[': ']', '{': '}', '`': '`', '*': '*', '_': '_' };
const FILL_COLUMN = 100;

let folders = [], currentFolder = null;
let prompts = [], current = null, saveTimer = null;
let cmdTimer = null, extractingCmd = false;
const cmdSkip = new Set();
let blocks = [];
let permanentTags = [];
let sugItems = [], sugIndex = 0, sugPrefix = '';
let filling = false;
let prevValue = '';

/* ---------- api ---------- */
async function api(path, opts) {
  const r = await fetch('/api' + path, opts);
  return r.json();
}
const jsonOpts = (method, body) => ({
  method,
  headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify(body)
});
const fPath = f => '/folders/' + encodeURIComponent(f);
const pPath = (f, n) => fPath(f) + '/prompts/' + encodeURIComponent(n);

/* ---------- modal ---------- */
const modal = $('#modal'), modalInput = $('#modal-input');
let modalResolve = null;

function promptName(defaultValue, { title = 'Name', confirmLabel = 'OK' } = {}) {
  if (modalResolve) modalResolve(null);
  return new Promise(resolve => {
    modalResolve = resolve;
    $('#modal-title').textContent = title;
    $('#modal-ok').textContent = confirmLabel;
    modalInput.value = defaultValue || '';
    modal.hidden = false;
    modalInput.focus();
    modalInput.select();
  });
}
function closeModal(result) {
  if (!modalResolve) return;
  const r = modalResolve;
  modalResolve = null;
  modal.hidden = true;
  r(result);
}
$('#modal-ok').onclick = () => closeModal(modalInput.value);
$('#modal-cancel').onclick = () => closeModal(null);
modal.addEventListener('click', e => { if (e.target === modal) closeModal(null); });
modalInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); closeModal(modalInput.value); }
  else if (e.key === 'Escape') { e.preventDefault(); closeModal(null); }
});

async function renamePrompt(p) {
  const name = await promptName(p.name, { title: 'Rename prompt', confirmLabel: 'Rename' });
  if (name === null) return;
  const newName = name.trim();
  if (!newName || newName === p.name) return;
  await flushSave();
  const r = await api(pPath(currentFolder, p.name), jsonOpts('PUT', { name: newName }));
  if (r.error) { alert(r.error); return; }
  if (current && current.folder === currentFolder && current.name === p.name) {
    current.name = r.name;
    titleInput.value = r.name;
  }
  p.name = r.name;
  renderList();
}

/* ---------- sidebar: folders ---------- */
const sidebar = $('#sidebar');

function renderFolders() {
  const ul = $('#folder-list');
  ul.innerHTML = '';
  for (const f of folders) {
    const li = document.createElement('li');
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = f.name;
    name.title = 'Double-click to rename';
    name.ondblclick = e => { e.stopPropagation(); renameFolder(f); };
    const count = document.createElement('span');
    count.className = 'count';
    count.textContent = f.prompt_count;
    const del = document.createElement('button');
    del.className = 'del';
    del.textContent = '×';
    del.title = 'Delete folder';
    del.onclick = e => {
      e.stopPropagation();
      if (confirm('Delete folder "' + f.name + '" and all its prompts?')) removeFolder(f.name);
    };
    li.append(name, count, del);
    li.onclick = () => openFolder(f.name);
    ul.appendChild(li);
  }
}

async function refreshFolders() {
  const r = await api('/folders');
  if (Array.isArray(r)) folders = r;
  renderFolders();
}

async function createFolder() {
  const name = await promptName('Untitled', { title: 'New folder', confirmLabel: 'Create' });
  if (name === null || !name.trim()) return;
  const r = await api('/folders', jsonOpts('POST', { name: name.trim() }));
  if (r.error) { alert(r.error); return; }
  await refreshFolders();
  openFolder(r.name);
}

async function renameFolder(f) {
  const name = await promptName(f.name, { title: 'Rename folder', confirmLabel: 'Rename' });
  if (name === null) return;
  const newName = name.trim();
  if (!newName || newName === f.name) return;
  await flushSave();
  const r = await api(fPath(f.name), jsonOpts('PUT', { name: newName }));
  if (r.error) { alert(r.error); return; }
  if (currentFolder === f.name) {
    currentFolder = r.name;
    $('#folder-name').textContent = r.name;
  }
  if (current && current.folder === f.name) current.folder = r.name;
  await refreshFolders();
}

async function removeFolder(name) {
  await fetch('/api' + fPath(name), { method: 'DELETE' });
  if (current && current.folder === name) clearEditor();
  if (currentFolder === name) {
    currentFolder = null;
    sidebar.classList.remove('in-folder');
  }
  await refreshFolders();
}

async function openFolder(name) {
  await flushSave();
  currentFolder = name;
  $('#folder-name').textContent = name;
  await refreshPrompts();
  sidebar.classList.add('in-folder');
  if (current && current.folder === name) renderList();
  else if (prompts[0]) select(prompts[0].name);
}

$('#new-folder').onclick = createFolder;
$('#back').onclick = () => {
  sidebar.classList.remove('in-folder');
  refreshFolders();
};

/* ---------- sidebar: prompts ---------- */
function clearEditor() {
  current = null;
  ta.value = ''; titleInput.value = '';
  prevValue = '';
  clearTimeout(saveTimer); saveTimer = null;
  setStatus('');
  highlight();
}

function renderList() {
  const ul = $('#list');
  ul.innerHTML = '';
  for (const p of prompts) {
    const li = document.createElement('li');
    if (current && current.folder === currentFolder && current.name === p.name) li.classList.add('active');
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = p.name;
    name.title = 'Double-click to rename';
    name.ondblclick = e => { e.stopPropagation(); renamePrompt(p); };
    const del = document.createElement('button');
    del.className = 'del';
    del.textContent = '×';
    del.title = 'Delete';
    del.onclick = e => {
      e.stopPropagation();
      if (confirm('Delete "' + p.name + '"?')) removePrompt(p.name);
    };
    li.append(name, del);
    li.onclick = () => select(p.name);
    ul.appendChild(li);
  }
}

async function refreshPrompts() {
  const r = await api(fPath(currentFolder) + '/prompts');
  if (Array.isArray(r)) prompts = r;
  renderList();
}

async function select(name) {
  await flushSave();
  const r = await api(pPath(currentFolder, name));
  if (r.error) return;
  current = { folder: currentFolder, name: r.name, content: r.content || '' };
  titleInput.value = r.name;
  ta.value = r.content || '';
  prevValue = ta.value;
  highlight();
  syncScroll();
  renderList();
  setStatus('');
  closeSug();
  ta.focus();
}

async function removePrompt(name) {
  await fetch('/api' + pPath(currentFolder, name), { method: 'DELETE' });
  prompts = prompts.filter(p => p.name !== name);
  if (current && current.folder === currentFolder && current.name === name) {
    clearEditor();
    if (prompts[0]) { renderList(); return select(prompts[0].name); }
  }
  renderList();
}

/* ---------- highlighting ---------- */
function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
const PLACEHOLDER =
`Write your prompt…

<          tag suggestions, tags auto-close
</         completes the open tag
select     then " ' ( [ { \` * _ to wrap it, Tab to indent
Ctrl+B/I/E **bold** *italic* \`code\`
\`\`\`lang    fenced code blocks`;

const TOKEN = /(^[ \t]*```[^\n]*(?:\n(?:[\s\S]*?\n[ \t]*```[ \t]*$|[\s\S]*$))?)|(&lt;\/?[A-Za-z_][\w.:-]*[\s\S]*?&gt;)|(\*\*[^*\n]+\*\*)|(\*[^*\n]+\*)|(`[^`\n]+`)|(^#{1,6} [^\n]*)/gm;

function tagClass(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 101 + name.charCodeAt(i)) >>> 0;
  return 'tg tg-' + (h % 10);
}

function highlight() {
  if (!ta.value) {
    hl.innerHTML = '<span class="ph">' + esc(PLACEHOLDER) + '</span>\n';
    return;
  }
  let s = esc(ta.value);
  s = s.replace(TOKEN, (m, fence, tag, bold, ital, code, head) => {
    if (fence) {
      const styled = fence
        .replace(/^([ \t]*```[^\n]*)/, '<span class="md-f">$1</span>')
        .replace(/\n([ \t]*```[ \t]*)$/, '\n<span class="md-f">$1</span>');
      return '<span class="md-cb">' + styled + '</span>';
    }
    if (tag) {
      return tag.replace(/^(&lt;\/?)([\w.:-]+)([\s\S]*?)(\/?&gt;)$/, (_, o, name, mid, c) => {
        mid = mid.replace(/([A-Za-z_][\w-]*)(=)/g, '<span class="at">$1</span>$2');
        return '<span class="pu">' + o + '</span><span class="' + tagClass(name) + '">' + name + '</span>' + mid + '<span class="pu">' + c + '</span>';
      });
    }
    if (bold) return '<span class="md-b">' + bold + '</span>';
    if (ital) return '<span class="md-i">' + ital + '</span>';
    if (code) return '<span class="md-c">' + code + '</span>';
    return '<span class="md-h">' + head + '</span>';
  });
  hl.innerHTML = s + '\n';
}
function syncScroll() {
  hlPre.scrollTop = ta.scrollTop;
  hlPre.scrollLeft = ta.scrollLeft;
}
ta.addEventListener('scroll', syncScroll);

/* ---------- text insertion (keeps native undo) ---------- */
function insertText(text) {
  ta.focus();
  let ok = false;
  try { ok = document.execCommand('insertText', false, text); } catch (e) {}
  if (!ok) {
    ta.setRangeText(text, ta.selectionStart, ta.selectionEnd, 'end');
    ta.dispatchEvent(new Event('input', { bubbles: true }));
  }
}
function setCursor(p) { ta.selectionStart = ta.selectionEnd = p; }

/* ---------- editing behaviors ---------- */
function inCodeContext(before) {
  const lines = before.split('\n');
  const line = lines.pop();
  let fences = 0;
  for (const l of lines) if (/^[ \t]*```/.test(l)) fences++;
  if (fences % 2) return true;
  if (/^[ \t]*```/.test(line)) return true;
  return (line.split('`').length - 1) % 2 === 1;
}

function stripCode(text) {
  return text
    .replace(/^[ \t]*```[^\n]*\n[\s\S]*?\n[ \t]*```[ \t]*$/gm, '')
    .replace(/^[ \t]*```[^\n]*[\s\S]*$/m, '')
    .replace(/`[^`\n]*`/g, '');
}

function openTagStack(text) {
  const stack = [];
  const re = /<(\/?)([A-Za-z_][\w.:-]*)(?:[^<>]*?)(\/?)>/g;
  let m;
  while ((m = re.exec(stripCode(text)))) {
    if (m[3]) continue;                       // self-closing
    if (m[1]) {                                // closing tag
      const i = stack.lastIndexOf(m[2]);
      if (i >= 0) stack.length = i;
    } else stack.push(m[2]);
  }
  return stack;
}

function handleGt(e) {
  const pos = ta.selectionStart;
  if (pos !== ta.selectionEnd) return;
  const before = ta.value.slice(0, pos);
  if (inCodeContext(before)) return;
  const m = before.match(/<([A-Za-z_][\w.:-]*)((?:\s[^<>]*)?)$/);
  if (!m || /\/\s*$/.test(m[2])) return;
  e.preventDefault();
  if (!m[2] && findBlock(m[1])) { expandBlock(pos - m[0].length, pos, findBlock(m[1])); closeSug(); return; }
  insertText('></' + m[1] + '>');
  setCursor(pos + 1);
  closeSug();
}

function handleSlash(e) {
  const pos = ta.selectionStart;
  if (pos !== ta.selectionEnd) return;
  const before = ta.value.slice(0, pos);
  if (!before.endsWith('<')) return;
  if (inCodeContext(before)) return;
  const stack = openTagStack(before.slice(0, -1));
  if (!stack.length) return;
  e.preventDefault();
  const name = stack[stack.length - 1];
  const lm = before.match(/(?:^|\n)([ \t]*)<$/);
  if (lm && lm[1].length >= 2) {
    // closing tag on its own line: dedent one level
    ta.setSelectionRange(pos - 3, pos);
    insertText('</' + name + '>');
  } else {
    insertText('/' + name + '>');
  }
  closeSug();
}

function handleEnter(e) {
  const pos = ta.selectionStart;
  const before = ta.value.slice(0, pos);
  const after = ta.value.slice(ta.selectionEnd);
  const line = before.slice(before.lastIndexOf('\n') + 1);
  const indent = (line.match(/^[ \t]*/) || [''])[0];
  const opensBlock = /<[A-Za-z_][\w.:-]*(?:\s[^<>]*)?>$/.test(before) && !/\/>$/.test(before) && !inCodeContext(before);
  e.preventDefault();
  if (opensBlock && /^<\//.test(after)) {
    insertText('\n' + indent + '  \n' + indent);
    setCursor(pos + 1 + indent.length + 2);
  } else if (opensBlock) {
    insertText('\n' + indent + '  ');
  } else {
    insertText('\n' + indent);
  }
}

function indentLines(dedent) {
  const s = ta.selectionStart, e2 = ta.selectionEnd;
  const v = ta.value;
  const ls = v.lastIndexOf('\n', s - 1) + 1;
  let le = v.indexOf('\n', e2);
  if (le === -1) le = v.length;
  const out = v.slice(ls, le)
    .split('\n')
    .map(l => dedent ? l.replace(/^ {1,2}/, '') : '  ' + l)
    .join('\n');
  ta.setSelectionRange(ls, le);
  insertText(out);
  ta.selectionStart = ls;
  ta.selectionEnd = ls + out.length;
}

function wrapSelection(open, close) {
  const s = ta.selectionStart, e2 = ta.selectionEnd;
  const sel = ta.value.slice(s, e2);
  insertText(open + sel + close);
  if (!sel) setCursor(s + open.length);
  else { ta.selectionStart = s + open.length; ta.selectionEnd = s + open.length + sel.length; }
}

function computeFill(value, pos) {
  const ls = value.lastIndexOf('\n', pos - 1) + 1;
  let le = value.indexOf('\n', pos);
  if (le === -1) le = value.length;
  if (pos !== le) return null;
  const line = value.slice(ls, le);
  if (line.length <= FILL_COLUMN) return null;
  if (/^[ \t]*<[^\n]*>[ \t]*$/.test(line)) return null;
  if (inCodeContext(value.slice(0, pos))) return null;
  const indent = (line.match(/^[ \t]*/) || [''])[0];
  let brk = line.lastIndexOf(' ', FILL_COLUMN);
  if (brk <= indent.length) brk = line.lastIndexOf(' ');
  if (brk <= indent.length) return null;
  const abs = ls + brk;
  return {
    brk: abs,
    indent,
    newValue: value.slice(0, abs) + '\n' + indent + value.slice(abs + 1),
    newCursor: pos + indent.length
  };
}

function maybeFill(e) {
  if (filling || e.inputType !== 'insertText' || !e.data || e.data.length !== 1) return;
  const f = computeFill(ta.value, ta.selectionStart);
  if (!f) return;
  filling = true;
  ta.setSelectionRange(f.brk, f.brk + 1);
  insertText('\n' + f.indent);
  ta.setSelectionRange(f.newCursor, f.newCursor);
  filling = false;
}

function diffChange(oldV, newV) {
  if (oldV === newV) return null;
  let start = 0;
  const min = Math.min(oldV.length, newV.length);
  while (start < min && oldV[start] === newV[start]) start++;
  let oldEnd = oldV.length, newEnd = newV.length;
  while (oldEnd > start && newEnd > start && oldV[oldEnd - 1] === newV[newEnd - 1]) { oldEnd--; newEnd--; }
  return { start, removed: oldEnd - start, inserted: newEnd - start };
}

function editedTagName(newV, start, inserted) {
  let i = start;
  while (i > 0 && /[\w.:-]/.test(newV[i - 1])) i--;
  let isClosing;
  if (newV[i - 1] === '<') isClosing = false;
  else if (newV[i - 1] === '/' && newV[i - 2] === '<') isClosing = true;
  else return null;
  let j = start + inserted;
  while (j < newV.length && /[\w.:-]/.test(newV[j])) j++;
  const name = newV.slice(i, j);
  if (name && !/^[A-Za-z_]/.test(name)) return null;
  return { nameStart: i, nameEnd: j, name, isClosing };
}

function tagList(text) {
  const tags = [];
  const re = /<(\/?)([A-Za-z_][\w.:-]*|(?=>))([^<>]*?)(\/?)>/g;
  let m;
  while ((m = re.exec(text))) {
    if (inCodeContext(text.slice(0, m.index))) continue;
    tags.push({ isClose: !!m[1], name: m[2], selfClose: !!m[4], nameStart: m.index + 1 + m[1].length });
  }
  return tags;
}

function findPartner(tags, idx) {
  const t = tags[idx];
  let depth = 1;
  if (!t.isClose) {
    for (let i = idx + 1; i < tags.length; i++) {
      const o = tags[i];
      if (o.name !== t.name || o.selfClose) continue;
      depth += o.isClose ? -1 : 1;
      if (!depth) return o;
    }
  } else {
    for (let i = idx - 1; i >= 0; i--) {
      const o = tags[i];
      if (o.name !== t.name || o.selfClose) continue;
      depth += o.isClose ? 1 : -1;
      if (!depth) return o;
    }
  }
  return null;
}

function computeTagSync(oldV, newV) {
  const d = diffChange(oldV, newV);
  if (!d) return null;
  if (!/^[\w.:-]*$/.test(newV.slice(d.start, d.start + d.inserted))) return null;
  if (!/^[\w.:-]*$/.test(oldV.slice(d.start, d.start + d.removed))) return null;
  const span = editedTagName(newV, d.start, d.inserted);
  if (!span) return null;
  if (inCodeContext(newV.slice(0, span.nameStart))) return null;
  let k = span.nameStart;
  while (k < oldV.length && /[\w.:-]/.test(oldV[k])) k++;
  if (d.start + d.removed > k) return null;
  const oldName = oldV.slice(span.nameStart, k);
  if (oldName === span.name) return null;
  const tags = tagList(oldV);
  const idx = tags.findIndex(t => t.nameStart === span.nameStart && t.isClose === span.isClosing);
  if (idx < 0 || tags[idx].name !== oldName || tags[idx].selfClose) return null;
  const partner = findPartner(tags, idx);
  if (!partner) return null;
  const delta = d.inserted - d.removed;
  const pStart = partner.nameStart + (partner.nameStart > d.start ? delta : 0);
  const prefix = partner.isClose ? '</' : '<';
  if (pStart < prefix.length) return null;
  if (newV.slice(pStart - prefix.length, pStart) !== prefix) return null;
  if (newV.slice(pStart, pStart + oldName.length) !== oldName) return null;
  const nextCh = newV[pStart + oldName.length];
  if (nextCh !== undefined && /[\w.:-]/.test(nextCh)) return null;
  return { start: pStart, end: pStart + oldName.length, name: span.name };
}

function syncTagRename() {
  const r = computeTagSync(prevValue, ta.value);
  if (r) {
    const s = ta.selectionStart, e2 = ta.selectionEnd;
    const shift = r.name.length - (r.end - r.start);
    ta.setRangeText(r.name, r.start, r.end, 'preserve');
    if (r.start < s) ta.setSelectionRange(s + shift, e2 + shift);
    else ta.setSelectionRange(s, e2);
  }
  prevValue = ta.value;
}

ta.addEventListener('keydown', e => {
  if (!sug.hidden) {
    if (e.key === 'ArrowDown') { e.preventDefault(); moveSug(1); return; }
    if (e.key === 'ArrowUp')   { e.preventDefault(); moveSug(-1); return; }
    if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); acceptSug(); return; }
    if (e.key === 'Escape') { e.preventDefault(); closeSug(); return; }
  }
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey) {
    const k = e.key.toLowerCase();
    if (k === 'b') { e.preventDefault(); wrapSelection('**', '**'); return; }
    if (k === 'i') { e.preventDefault(); wrapSelection('*', '*'); return; }
    if (k === 'e') { e.preventDefault(); wrapSelection('`', '`'); return; }
    if (k === 's') { e.preventDefault(); flushSave(); return; }
    return;
  }
  const hasSel = ta.selectionStart !== ta.selectionEnd;
  if (hasSel && WRAP_PAIRS[e.key] && !e.altKey) {
    e.preventDefault();
    wrapSelection(e.key, WRAP_PAIRS[e.key]);
    return;
  }
  if (e.key === 'Tab') {
    e.preventDefault();
    if (e.shiftKey || hasSel) indentLines(e.shiftKey);
    else insertText('  ');
    return;
  }
  if (e.shiftKey) {
    if (e.key === '>') return handleGt(e);
    return;
  }
  if (e.key === '>') return handleGt(e);
  if (e.key === '/') return handleSlash(e);
  if (e.key === 'Enter') return handleEnter(e);
});

/* ---------- custom blocks ---------- */
async function loadBlocks() {
  try {
    const r = await api('/blocks');
    if (Array.isArray(r)) blocks = r;
  } catch (e) {}
}
function findBlock(command) {
  return blocks.find(b => b.command === command) || null;
}
/* Replace value[start,end) (the "<command" text) with the block content,
   re-indented to the line's indentation; cursor goes to the first empty "><" spot. */
function expandBlock(start, end, block) {
  const v = ta.value;
  const ls = v.lastIndexOf('\n', start - 1) + 1;
  const indent = (v.slice(ls, start).match(/^[ \t]*/) || [''])[0];
  const lines = (block.content || '').replace(/\r\n?/g, '\n').replace(/\n+$/, '').split('\n');
  const text = lines.map((l, i) => (i === 0 || !l) ? l : indent + l).join('\n');
  ta.setSelectionRange(start, end);
  insertText(text);
  const empty = text.indexOf('><');
  setCursor(start + (empty >= 0 ? empty + 1 : text.length));
}
/* ---------- permanent tags ---------- */
async function loadTags() {
  try {
    const r = await api('/tags');
    if (Array.isArray(r)) permanentTags = r.map(t => t.name);
  } catch (e) { permanentTags = permanentTags || []; }
}
function refreshShared() { loadBlocks(); loadTags(); }
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshShared(); });
window.addEventListener('focus', refreshShared);

/* ---------- tag suggestions ---------- */
function allTags() {
  const set = new Set(permanentTags);
  const re = /<([A-Za-z_][\w.:-]*)/g;
  let m;
  while ((m = re.exec(ta.value))) set.add(m[1]);
  return [...set].sort();
}

function updateSug() {
  const pos = ta.selectionStart;
  if (pos !== ta.selectionEnd) return closeSug();
  const before = ta.value.slice(0, pos);
  const m = before.match(/<([A-Za-z_][\w.:-]*)?$/);
  if (!m) return closeSug();
  sugPrefix = m[1] || '';
  const blockItems = blocks
    .filter(b => b.command.startsWith(sugPrefix))
    .map(b => ({ name: b.command, block: b }));
  const tagItems = allTags()
    .filter(t => t.startsWith(sugPrefix) && t !== sugPrefix && !findBlock(t))
    .map(t => ({ name: t }));
  sugItems = [...blockItems, ...tagItems].slice(0, 12);
  if (!sugItems.length) return closeSug();
  sugIndex = 0;
  renderSug();
  positionSug();
  sug.hidden = false;
}

function renderSug() {
  sug.innerHTML = '';
  sugItems.forEach(({ name, block }, i) => {
    const d = document.createElement('div');
    if (i === sugIndex) d.classList.add('sel');
    if (block) d.classList.add('block');
    d.innerHTML = '<span class="' + (block ? '' : tagClass(name)) + '"><b>' + esc(sugPrefix) + '</b>' + esc(name.slice(sugPrefix.length)) + '</span>'
      + (block ? '<span class="badge">block</span>' : '');
    d.addEventListener('mousedown', ev => { ev.preventDefault(); sugIndex = i; acceptSug(); });
    sug.appendChild(d);
  });
}

function moveSug(dir) {
  sugIndex = (sugIndex + dir + sugItems.length) % sugItems.length;
  renderSug();
  const el = sug.children[sugIndex];
  if (el) el.scrollIntoView({ block: 'nearest' });
}

function acceptSug() {
  const item = sugItems[sugIndex];
  if (!item) return closeSug();
  const { name, block } = item;
  const pos = ta.selectionStart;
  const rest = name.slice(sugPrefix.length);
  const inCode = inCodeContext(ta.value.slice(0, pos));
  if (block && !inCode) {
    expandBlock(pos - sugPrefix.length - 1, pos, block);
  } else if (inCode) {
    insertText(rest + '>');
  } else {
    insertText(rest + '></' + name + '>');
    setCursor(pos + rest.length + 1);
  }
  closeSug();
}

function closeSug() {
  sug.hidden = true;
  sugItems = [];
}
ta.addEventListener('blur', closeSug);
ta.addEventListener('click', closeSug);

function caretXY() {
  const style = getComputedStyle(ta);
  const div = document.createElement('div');
  for (const p of ['fontFamily','fontSize','fontWeight','lineHeight','letterSpacing','tabSize',
                   'paddingTop','paddingRight','paddingBottom','paddingLeft','boxSizing','borderWidth']) {
    div.style[p] = style[p];
  }
  div.style.position = 'absolute';
  div.style.visibility = 'hidden';
  div.style.whiteSpace = 'pre-wrap';
  div.style.wordWrap = 'break-word';
  div.style.width = ta.clientWidth + 'px';
  div.textContent = ta.value.slice(0, ta.selectionStart);
  const marker = document.createElement('span');
  marker.textContent = '​';
  div.appendChild(marker);
  document.body.appendChild(div);
  const xy = { x: marker.offsetLeft, y: marker.offsetTop, lineH: parseFloat(style.lineHeight) || 24 };
  div.remove();
  return xy;
}

function positionSug() {
  const c = caretXY();
  let left = c.x - ta.scrollLeft;
  let top = c.y + c.lineH - ta.scrollTop + 2;
  left = Math.max(4, Math.min(left, wrapEl.clientWidth - 210));
  top = Math.max(4, Math.min(top, wrapEl.clientHeight - 60));
  sug.style.left = left + 'px';
  sug.style.top = top + 'px';
}

/* ---------- <command> extraction ---------- */
/* A complete <command>…</command> element (no name attribute yet, caret outside)
   is saved as a new .xml prompt file in the current folder, then stamped with
   name="…" so it is only extracted once. */
const CMD_TAG_RE = /<command(\s[^<>]*)?>([\s\S]*?)<\/command>/g;

function unwrapFence(s) {
  const m = s.trim().match(/^```[^\n]*\n?([\s\S]*?)\n?```$/);
  return (m ? m[1] : s).trim() + '\n';
}

function scheduleCmdCheck() {
  clearTimeout(cmdTimer);
  cmdTimer = setTimeout(checkCommands, 800);
}

async function checkCommands() {
  if (!current || extractingCmd || modalResolve) return;
  const v = ta.value;
  CMD_TAG_RE.lastIndex = 0;
  let m;
  while ((m = CMD_TAG_RE.exec(v))) {
    const attrs = m[1] || '';
    if (/\bname\s*=/.test(attrs)) continue;
    if (!m[2].trim()) continue;
    if (cmdSkip.has(m[0])) continue;
    const start = m.index, end = m.index + m[0].length;
    if (document.activeElement === ta && ta.selectionStart > start && ta.selectionStart < end) continue;
    await extractCommand(m[0], attrs, m[2]);
    return;
  }
}

async function extractCommand(raw, attrs, inner) {
  extractingCmd = true;
  try {
    const folder = current.folder;
    const name = await promptName('Untitled', { title: 'Save <command> as prompt', confirmLabel: 'Save' });
    if (name === null || !name.trim()) { cmdSkip.add(raw); return; }
    const r = await api(fPath(folder) + '/prompts', jsonOpts('POST', { name: name.trim(), content: unwrapFence(inner) }));
    if (r.error) { alert(r.error); cmdSkip.add(raw); return; }
    const idx = ta.value.indexOf(raw);
    if (idx >= 0) {
      const stamped = '<command name="' + r.name.replace(/&/g, '&amp;').replace(/"/g, '&quot;') + '"'
        + attrs + raw.slice(('<command' + attrs).length);
      ta.setRangeText(stamped, idx, idx + raw.length, 'preserve');
      prevValue = ta.value;
      highlight();
    }
    if (current) {
      current.content = ta.value;
      await api(pPath(current.folder, current.name), jsonOpts('PUT', { content: current.content }));
      setStatus('');
    }
    if (currentFolder === folder) {
      await refreshPrompts();
      await select(r.name);
    }
  } finally {
    extractingCmd = false;
  }
}

ta.addEventListener('blur', () => setTimeout(checkCommands, 100));

/* ---------- wire up ---------- */
ta.addEventListener('input', e => {
  maybeFill(e);
  syncTagRename();
  highlight();
  syncScroll();
  scheduleSave();
  updateSug();
  scheduleCmdCheck();
});

renderTmenu();
highlight();
(async () => {
  await Promise.all([loadBlocks(), loadTags()]);
  await refreshFolders();
})();
</script>
